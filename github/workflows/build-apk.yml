name: Build APK from zip
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          test -f leh-qalha-android.zip || { echo "leh-qalha-android.zip not found in repo root"; exit 1; }
          mkdir work
          unzip -q leh-qalha-android.zip -d work
          DIR=$(dirname "$(find work -name package.json -not -path '*/node_modules/*' | head -n1)")
          echo "PROJ_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install and build
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          npm install
          npm run apk
      - uses: actions/upload-artifact@v4
        with:
          name: leh-qalha-apk
          path: ${{ env.PROJ_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
