
name: Build Leyh Qalha APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'build-apk.yml'
      - '.github/workflows/build-apk.yml'
      - 'leyh-qalha-project-upload.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f leyh-qalha-project-upload.zip || {
            echo "Project ZIP was not found"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir -p work
          unzip -q leyh-qalha-project-upload.zip -d work
          DIR="$(dirname "$(find work -name package.json -not -path '*/node_modules/*' -print -quit)")"
          test -f "$DIR/package.json"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev esbuild@^0.28.0 --legacy-peer-deps
          npm install @capacitor/core@^7 @capacitor/android@^7 --legacy-peer-deps
          npm install --save-dev @capacitor/cli@^7 --legacy-peer-deps

      - name: Configure Android app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.leyhqalha.app",
            "appName": "ليه قالها",
            "webDir": "dist"
          }
          EOF

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Prepare Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leyh-qalha-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
