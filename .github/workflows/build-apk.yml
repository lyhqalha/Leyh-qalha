- name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -d dist ]; then
            WEB_DIR="dist"
          elif [ -d build ]; then
            WEB_DIR="build"
          elif [ -d www ]; then
            WEB_DIR="www"
          else
            echo "ERROR: Web build folder not found."
            echo "Expected dist, build, or www."
            exit 1
          fi

          if [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ] && \
             [ ! -f capacitor.config.json ]; then
            printf '{\n  "appId": "com.leyhqalha.app",\n  "appName": "ليه قالها",\n  "webDir": "%s"\n}\n' "$WEB_DIR" \
              > capacitor.config.json
          fi

          npx cap add android
          npx cap sync android
