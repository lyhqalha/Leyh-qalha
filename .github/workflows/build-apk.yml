name: Build Leyh Qalha APK

on:
push:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check and extract project ZIP
    shell: bash
    run: |
      set -e
      ZIP="leyh-qalha-project-upload.zip"

      if [ ! -f "$ZIP" ]; then
        echo "ERROR: $ZIP was not found in the repository root."
        exit 1
      fi

      mkdir -p work
      unzip -q "$ZIP" -d work

      PACKAGE_FILE="$(find work -name package.json -not -path '*/node_modules/*' -print -quit)"

      if [ -z "$PACKAGE_FILE" ]; then
        echo "ERROR: No package.json was found inside the ZIP."
        exit 1
      fi

      echo "PROJECT_DIR=$(dirname "$PACKAGE_FILE")" >> "$GITHUB_ENV"

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: |
        platform-tools
        platforms;android-35
        build-tools;35.0.0

  - name: Install dependencies
    working-directory: ${{ env.PROJECT_DIR }}
    run: npm install

  - name: Build Android APK
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -e

      if [ -f android/gradlew ]; then
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
      else
        npm run build
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: leyh-qalha-apk
      path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
