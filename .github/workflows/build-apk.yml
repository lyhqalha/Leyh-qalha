name: Build APK from parts
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge zip parts
        run: |
          ls part*.zip || { echo "part*.zip files not found in repo root"; exit 1; }
          mkdir work
          for f in part*.zip; do unzip -q -o "$f" -d work; done
          echo "PROJ_DIR=work" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install and build
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          npm install
          npm run apk
      - uses: actions/upload-artifact@v4
        with:
          name: leh-qalha-apk
          path: ${{ env.PROJ_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
