name: Build APK from parts
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge zip parts
        run: |
          ls part*.zip || { echo "part*.zip files not found in repo root"; exit 1; }
          mkdir work
          for f in part*.zip; do unzip -q -o "$f" -d work; done
          echo "PROJ_DIR=work" >> "$GITHUB_ENV"
      - name: Use JSON capacitor config
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lehqalha.app",
            "appName": "ليه قالها؟",
            "webDir": "dist",
            "backgroundColor": "#0D131F",
            "android": {
              "adjustMarginsForEdgeToEdge": "disable",
              "allowMixedContent": false
            },
            "plugins": {
              "LocalNotifications": {
                "iconColor": "#E2B773",
                "sound": "hadith_tone.wav"
              }
            }
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi
      - name: Install and build
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run apk
      - uses: actions/upload-artifact@v4
        with:
          name: leh-qalha-apk
          path: ${{ env.PROJ_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
