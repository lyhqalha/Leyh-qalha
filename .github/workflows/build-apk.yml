name: Build Leyh Qalha APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - name: Set up Node
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Android
    uses: android-actions/setup-android@v3

  - name: Install SDK packages
    run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract project
    shell: bash
    run: |
      set -e
      unzip -q leyh-qalha-project-upload.zip -d work
      PACKAGE_FILE="$(find work -name package.json -not -path '*/node_modules/*' -print -quit)"
      test -n "$PACKAGE_FILE" || { echo "package.json not found"; exit 1; }
      echo "PROJECT_DIR=$(dirname "$PACKAGE_FILE")" >> "$GITHUB_ENV"

  - name: Install dependencies
    working-directory: ${{ env.PROJECT_DIR }}
    run: npm install

  - name: Build APK
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -e
      npm run build
      npx cap sync android
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: leyh-qalha-apk
      path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
